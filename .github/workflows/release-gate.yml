name: Release gate

on:
  workflow_call:
    inputs:
      tag:
        description: Tag being released (e.g. v3.21.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-gate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  version-consistency:
    name: Version metadata consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Run check-version
        run: node scripts/check-version.mjs

  lint:
    name: Lint + format
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  server-tests:
    name: Server tests + coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install PDF extraction and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server tests
        run: npm test

      - name: Run server coverage
        run: npm run test:coverage

  client-tests:
    name: Client tests + coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Run client tests
        run: npm --prefix client test

      - name: Run client coverage
        run: npm --prefix client run test:coverage

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  audits:
    name: Dependency audits (high+ blocks)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install npm 11 for bulk audit endpoint
        run: npm install --global npm@11

      - name: Audit production dependencies
        run: |
          audit() {
            local directory="$1"
            local attempt
            for attempt in 1 2 3; do
              if (cd "$directory" && npm audit --omit=dev --audit-level=high --package-lock-only --fetch-retries=0 --fetch-timeout=60000); then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 15))"
              fi
            done
            return 1
          }

          audit .
          audit client
          audit desktop-client-tauri
          audit mobile

  shellcheck:
    name: Shellcheck (release-critical bash)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Run shellcheck
        run: shellcheck -S warning scripts/*.sh

  packaging:
    name: Packaging smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Build server .deb
        run: ./scripts/build-deb.sh
