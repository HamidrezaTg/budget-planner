name: AUR Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aur:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate AUR package in clean Arch container
        env:
          AUR_USE_CONTAINER: '1'
        run: ./scripts/build-aur.sh
