name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must already exist; e.g. v3.21.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release gate
    uses: ./.github/workflows/release-gate.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  release:
    needs: release-gate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write # Sigstore keyless provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install PDF extraction and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci
          npm --prefix mobile ci
          if [ -f desktop-client-tauri/package-lock.json ]; then
            npm --prefix desktop-client-tauri ci
          else
            echo "no lockfile yet, falling back to npm install"
            npm --prefix desktop-client-tauri install --no-audit --no-fund
          fi

      - name: Run server tests
        run: npm test

      - name: Install Tauri v2 system dependencies (Debian)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: desktop-client-tauri/src-tauri -> target

      - name: Build server .deb (also rebuilds the web client)
        run: ./scripts/build-deb.sh

      - name: Build Tauri v2 client (.deb + .AppImage)
        # The Tauri CLI builds every target it can on the host. On Linux
        # runners that produces the .deb and the AppImage. macOS/Windows
        # bundles are produced by their own OS-specific workflows.
        run: ./scripts/build-tauri-client.sh

      - name: Check Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.BP_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BP_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BP_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing BP_ANDROID_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing BP_ANDROID_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing BP_ANDROID_KEY_ALIAS" >&2; exit 1; }

      - name: Materialize Android keystore in runner temp
        env:
          KEYSTORE_BASE64: ${{ secrets.BP_ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/budget-planner-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build signed Android APK
        run: ./scripts/build-apk.sh
        env:
          BP_ANDROID_KEYSTORE: ${{ runner.temp }}/budget-planner-release.keystore
          BP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BP_ANDROID_KEYSTORE_PASSWORD }}
          BP_ANDROID_KEY_ALIAS: ${{ secrets.BP_ANDROID_KEY_ALIAS }}
          BP_ANDROID_KEY_PASSWORD: ${{ secrets.BP_ANDROID_KEY_PASSWORD }}

      - name: Verify signed Android APK
        run: '$ANDROID_HOME/build-tools/35.0.0/apksigner verify dist/budget-planner-android.apk'

      - name: Build signed Android AAB (GitHub artifact only)
        run: |
          ( cd mobile/android && ./gradlew bundleRelease --no-daemon -q )
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab dist/budget-planner-android.aab
        env:
          BP_ANDROID_KEYSTORE: ${{ runner.temp }}/budget-planner-release.keystore
          BP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BP_ANDROID_KEYSTORE_PASSWORD }}
          BP_ANDROID_KEY_ALIAS: ${{ secrets.BP_ANDROID_KEY_ALIAS }}
          BP_ANDROID_KEY_PASSWORD: ${{ secrets.BP_ANDROID_KEY_PASSWORD }}

      - name: Upload Android GitHub build artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: budget-planner-android-github-builds
          if-no-files-found: error
          path: |
            dist/budget-planner-android.apk
            dist/budget-planner-android.aab
          retention-days: 14

      - name: Remove materialized Android keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/budget-planner-release.keystore"

      - name: Generate checksums
        run: |
          cp scripts/install.sh dist/budget-planner-install.sh
          cd dist
          sha256sum budget-planner-install.sh budget-planner-server_*_all.deb budget-planner-client_*.deb budget-planner-client_*.AppImage \
            $( [ -f budget-planner-android.apk ] && echo budget-planner-android.apk ) \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/budget-planner-install.sh
            dist/budget-planner-server_*_all.deb
            dist/budget-planner-client_*.deb
            dist/budget-planner-client_*.AppImage
            dist/budget-planner-android.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
           VERSION="${RELEASE_INPUT_TAG:-$(node -p "require('./package.json').version")}"
          fi
          # Manual dispatch always requires an explicit tag input so the
          # release can never publish a version the gate did not approve.
           if [ "${GITHUB_REF_TYPE}" != "tag" ] && [ -z "${RELEASE_INPUT_TAG:-}" ]; then
            echo "ERROR: workflow_dispatch requires an explicit tag input" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            PACKAGE_VERSION=$(node -p "require('./package.json').version")
            TAG="v${PACKAGE_VERSION}"
            test "${GITHUB_REF_NAME}" = "${TAG}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}" >&2
              exit 1
            }
           else
             PACKAGE_VERSION="${VERSION#v}"
             TAG="${VERSION}"
             case "${TAG}" in
               v*) ;;
               *) echo "Release tag must start with v" >&2; exit 1 ;;
             esac
             EXPECTED_TAG="v$(node -p "require('./package.json').version")"
             test "${TAG}" = "${EXPECTED_TAG}" || {
               echo "Tag ${TAG} does not match package.json version ${EXPECTED_TAG#v}" >&2
               exit 1
             }
           fi
          ARGS=()
          for f in dist/budget-planner-server_*_all.deb \
                   dist/budget-planner-install.sh \
                   dist/budget-planner-client_*_amd64.deb \
                   dist/budget-planner-client_*_amd64.AppImage \
                   dist/budget-planner-client_*_amd64.msi \
                   dist/budget-planner-client_*_amd64.exe \
                   dist/budget-planner-android.apk \
                   dist/SHA256SUMS.txt; do
            [ -f "$f" ] && ARGS+=("$f")
          done
          gh release create "$TAG" "${ARGS[@]}" \
            --title "$TAG" \
            --generate-notes

  windows:
    needs: release
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # Sigstore keyless provenance attestations
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client-tauri/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: x86_64-pc-windows-msvc

      - name: Install Node dependencies
        run: npm --prefix desktop-client-tauri ci --no-audit --no-fund

      - name: Check Windows signing secrets
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.BP_WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.BP_WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) { throw "Missing BP_WINDOWS_CERT_BASE64" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) { throw "Missing BP_WINDOWS_CERT_PASSWORD" }

      - name: Materialize Windows signing certificate
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.BP_WINDOWS_CERT_BASE64 }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "budget-planner-release.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          if (-not (Test-Path $certPath)) { throw "Certificate materialization failed" }

      - name: Build Windows MSI and NSIS bundles
        working-directory: desktop-client-tauri
        run: npm run tauri:build -- --bundles msi,nsis

      - name: Sign Windows installers
        shell: pwsh
        env:
          WINDOWS_CERT_PASSWORD: ${{ secrets.BP_WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe not found" }
          $files = @(Get-ChildItem "desktop-client-tauri\src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in @('.msi', '.exe') }
          )
          if ($files.Count -lt 2) { throw "Expected both MSI and NSIS installers" }
          foreach ($file in $files) {
            & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\budget-planner-release.pfx" /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($file.Name)" }
            # Authenticode verification: require a signature and a timestamp.
            # Untrusted-root results ('NotTrusted', or 'UnknownError' whose
            # message is the classic "root certificate which is not trusted")
            # only occur with self-signed bootstrap certificates; a production
            # CA cert reports 'Valid'. Anything else fails the job.
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($null -eq $sig.SignerCertificate) { throw "No signature present on $($file.Name)" }
            if ($null -eq $sig.TimeStamperCertificate) { throw "No timestamp on $($file.Name)" }
            if ($sig.Status -eq 'UnknownError' -and $sig.StatusMessage -match 'root certificate[^.]*not trusted') {
              Write-Host "$($file.Name): signed with a self-signed certificate (untrusted root) — accepted for bootstrap releases"
            }
            elseif ($sig.Status -notin @('Valid', 'NotTrusted')) {
              throw "Signature status '$($sig.Status)' for $($file.Name): $($sig.StatusMessage)"
            }
          }

      - name: Stage Windows installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $files = @(Get-ChildItem "desktop-client-tauri\src-tauri\target\release\bundle" -Recurse -File |
            Where-Object { $_.Extension -in @('.msi', '.exe') }
          )
          foreach ($file in $files) { Copy-Item $file.FullName (Join-Path "dist" $file.Name) }
          $msi = @(Get-ChildItem dist -Filter *.msi)
          $exe = @(Get-ChildItem dist -Filter *.exe)
          if ($msi.Count -lt 1 -or $exe.Count -lt 1) { throw "Staged Windows installers are incomplete" }

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.msi
            dist/*.exe

      - name: Upload Windows installers and update checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in @('.msi', '.exe') })
          gh release upload $env:RELEASE_TAG ($files.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw "Windows release upload failed" }
          gh release download $env:RELEASE_TAG --pattern SHA256SUMS.txt --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "Could not download release checksum manifest" }
          $manifest = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)" | Add-Content -Path $manifest
          }
          gh release upload $env:RELEASE_TAG $manifest --clobber
          if ($LASTEXITCODE -ne 0) { throw "Checksum manifest upload failed" }

      - name: Remove materialized Windows certificate
        if: always()
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\budget-planner-release.pfx"

  macos-dmg:
    needs: [release, windows]
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write # Sigstore keyless provenance attestations
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: desktop-client-tauri/src-tauri -> target

      - name: Build unsigned DMG
        run: ./scripts/build-dmg.sh

      - name: Add DMG checksum to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release download "v${VERSION}" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP"
          shasum -a 256 dist/*.dmg >> "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "v${VERSION}" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --clobber

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" dist/*.dmg --clobber

  aur:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate AUR package in clean Arch container
        env:
          AUR_USE_CONTAINER: '1'
        run: ./scripts/build-aur.sh
