name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci
          if [ -f desktop-client-tauri/package-lock.json ]; then
            npm --prefix desktop-client-tauri ci
          else
            echo "no lockfile yet, falling back to npm install"
            npm --prefix desktop-client-tauri install --no-audit --no-fund
          fi

      - name: Run server tests
        run: npm test

      - name: Install Tauri v2 system dependencies (Debian)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-client-tauri/src-tauri -> target

      - name: Build server .deb (also rebuilds the web client)
        run: ./scripts/build-deb.sh

      - name: Build Tauri v2 client (.deb + .AppImage)
        # The Tauri CLI builds every target it can on the host. On Linux
        # runners that produces the .deb and the AppImage. macOS/Windows
        # bundles are produced by their own OS-specific workflows.
        run: ./scripts/build-tauri-client.sh

      # Android release signing requires BP_ANDROID_KEYSTORE* secrets; without
      # them this step is skipped and the release ships without a new APK.
      - name: Check signing secret
        id: signcheck
        env:
          HAS_KEY: ${{ secrets.BP_ANDROID_KEYSTORE != '' }}
        run: echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"

      - name: Build signed Android APK
        if: steps.signcheck.outputs.has_key == 'true'
        run: ./scripts/build-apk.sh
        env:
          BP_ANDROID_KEYSTORE: ${{ secrets.BP_ANDROID_KEYSTORE }}
          BP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.BP_ANDROID_KEYSTORE_PASSWORD }}
          BP_ANDROID_KEY_ALIAS: ${{ secrets.BP_ANDROID_KEY_ALIAS }}
          BP_ANDROID_KEY_PASSWORD: ${{ secrets.BP_ANDROID_KEY_PASSWORD }}

      - name: Generate checksums
        run: |
          cd dist
          sha256sum budget-planner_*_all.deb budget-planner-client_*.deb budget-planner-client_*.AppImage \
            $( [ -f budget-planner-android.apk ] && echo budget-planner-android.apk ) \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          test "${GITHUB_REF_NAME}" = "${TAG}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION}"; exit 1;
          }
          ARGS=()
          for f in dist/budget-planner_*_all.deb \
                   dist/budget-planner-client_*_amd64.deb \
                   dist/budget-planner-client_*_amd64.AppImage \
                   dist/budget-planner-android.apk \
                   dist/SHA256SUMS.txt; do
            [ -f "$f" ] && ARGS+=("$f")
          done
          gh release create "$TAG" "${ARGS[@]}" \
            --title "v${VERSION}" \
            --generate-notes

  macos-dmg:
    needs: release
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-client-tauri/src-tauri -> target

      - name: Build unsigned DMG
        run: ./scripts/build-dmg.sh

      - name: Add DMG checksum to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release download "v${VERSION}" \
            --pattern SHA256SUMS.txt \
            --dir "$RUNNER_TEMP"
          sha256sum dist/*.dmg >> "$RUNNER_TEMP/SHA256SUMS.txt"
          gh release upload "v${VERSION}" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --clobber

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" dist/*.dmg --clobber

  aur:
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate AUR package in clean Arch container
        env:
          AUR_USE_CONTAINER: '1'
        run: ./scripts/build-aur.sh
