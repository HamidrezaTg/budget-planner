name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server tests
        run: npm test

      - name: Build the client
        run: npm run build

      - name: Dependency audit (high+ blocks)
        run: npm audit --omit=dev --audit-level=high

      - name: Version metadata consistency
        run: |
          ROOT=$(node -p "require('./package.json').version")
          DESKTOP=$(node -p "require('./desktop-client/package.json').version")
          MOBILE=$(node -p "require('./mobile/package.json').version")
          echo "root=$ROOT desktop=$DESKTOP mobile=$MOBILE"
          test "$ROOT" = "$DESKTOP"
          test "$ROOT" = "$MOBILE"
          echo "versions consistent"
