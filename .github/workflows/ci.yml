name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server tests
        run: npm test

      - name: Build the client
        run: npm run build

      - name: Dependency audit (high+ blocks)
        run: |
          npm audit --omit=dev --audit-level=high
          # The client bundle ships to browsers; its runtime deps are audited too.
          npm --prefix client audit --omit=dev --audit-level=high

      - name: Shellcheck (release-critical bash)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh

      - name: Packaging smoke (server deb builds from a clean checkout)
        run: ./scripts/build-deb.sh

      - name: Version metadata consistency
        run: |
          ROOT=$(node -p "require('./package.json').version")
          DESKTOP=$(node -p "require('./desktop-client/package.json').version")
          MOBILE=$(node -p "require('./mobile/package.json').version")
          CHANGELOG=$(head -1 CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "$ROOT")
          echo "root=$ROOT desktop=$DESKTOP mobile=$MOBILE changelog=$CHANGELOG"
          test "$ROOT" = "$DESKTOP"
          test "$ROOT" = "$MOBILE"
          echo "versions consistent"
