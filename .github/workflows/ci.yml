name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server tests
        run: npm test

      - name: Build the web client
        run: npm run build

      - name: Dependency audit (high+ blocks)
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high

      - name: Shellcheck (release-critical bash)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh

      - name: Packaging smoke (server deb builds from a clean checkout)
        run: ./scripts/build-deb.sh

      - name: Version metadata consistency
        run: |
          ROOT=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./desktop-client-tauri/package.json').version")
          MOBILE=$(node -p "require('./mobile/package.json').version")
          CHANGELOG=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "root=$ROOT tauri=$TAURI mobile=$MOBILE changelog=$CHANGELOG"
          test "$ROOT" = "$TAURI"
          test "$ROOT" = "$MOBILE"
          test "$ROOT" = "$CHANGELOG"
          echo "versions consistent"

  desktop-tauri:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-14
          - name: windows
            os: windows-2022
    name: desktop-tauri-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri v2 system dependencies (Debian)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-client-tauri/src-tauri -> target

      - name: Install Node dependencies
        run: npm --prefix desktop-client-tauri ci

      - name: Build the Tauri desktop client (deb + AppImage)
        if: runner.os == 'Linux'
        run: ./scripts/build-tauri-client.sh

      - name: Build the Tauri desktop client (DMG/MSI)
        if: runner.os != 'Linux'
        working-directory: desktop-client-tauri
        run: npm run tauri:build
