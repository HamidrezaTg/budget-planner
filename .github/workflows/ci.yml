name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server tests
        run: npm test

      - name: Build the client
        run: npm run build

      # xlsx has an unfixed HIGH advisory (prototype pollution / ReDoS). It is
      # being replaced; until then only CRITICAL findings block CI.
      - name: Dependency audit (critical+ blocks)
        run: npm audit --omit=dev --audit-level=critical

      - name: Version metadata consistency
        run: |
          ROOT=$(node -p "require('./package.json').version")
          DESKTOP=$(node -p "require('./desktop-client/package.json').version")
          echo "root=$ROOT desktop=$DESKTOP"
          test "$ROOT" = "$DESKTOP"
          echo "versions consistent"
