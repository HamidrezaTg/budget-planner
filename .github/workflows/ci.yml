name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install PDF extraction and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Run server tests
        run: npm test

      - name: Run server coverage
        run: npm run test:coverage

      - name: Run client coverage
        run: npm --prefix client run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-reports
          if-no-files-found: error
          path: |
            coverage/
            client/coverage/

      - name: Lint JavaScript
        run: npm run lint

      - name: Check JavaScript formatting
        run: npm run format:check

      - name: Build the web client
        run: npm run build

      - name: Dependency audit (high+ blocks)
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix client audit --omit=dev --audit-level=high

      - name: Shellcheck (release-critical bash)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh

      - name: Packaging smoke (server deb builds from a clean checkout)
        run: ./scripts/build-deb.sh

      - name: Version metadata consistency
        run: |
          ROOT=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./desktop-client-tauri/package.json').version")
          MOBILE=$(node -p "require('./mobile/package.json').version")
          CHANGELOG=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md)
          echo "root=$ROOT tauri=$TAURI mobile=$MOBILE changelog=$CHANGELOG"
          test "$ROOT" = "$TAURI"
          test "$ROOT" = "$MOBILE"
          test "$ROOT" = "$CHANGELOG"
          echo "versions consistent"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix client ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

  desktop-tauri:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: macos
            os: macos-14
          - name: windows
            os: windows-2022
    name: desktop-tauri-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri v2 system dependencies (Debian)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          targets: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          workspaces: desktop-client-tauri/src-tauri -> target

      - name: Install Node dependencies
        run: npm --prefix desktop-client-tauri ci

      - name: Build the Tauri desktop client (deb + AppImage)
        if: runner.os == 'Linux'
        run: ./scripts/build-tauri-client.sh

      - name: Verify Linux desktop bundles
        if: runner.os == 'Linux'
        run: |
          test -s dist/gulden-client_*_amd64.deb
          test -s dist/gulden-client_*_amd64.AppImage

      - name: Upload Linux desktop bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gulden-linux-bundles
          if-no-files-found: error
          path: |
            dist/gulden-client_*_amd64.deb
            dist/gulden-client_*_amd64.AppImage

      - name: Build the Tauri desktop client (DMG/MSI)
        if: runner.os != 'Linux'
        working-directory: desktop-client-tauri
        run: npm run tauri:build
