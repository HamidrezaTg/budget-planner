name: Mobile validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android build and native tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@9704b39bf258b59bc04b50fa2dd55e9ed76b47a8 # v4.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@651bceb6f9ca583f16b8d75b62c36ded2ae6fc9c # v4.0.0

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Run mobile configuration tests
        run: npm --prefix mobile test

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Run Android unit tests and build debug APK
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Validate Android APK
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          mobile/android/gradlew -p mobile/android :app:validateSigningDebug --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify mobile/android/app/build/outputs/apk/debug/app-debug.apk

  ios-scaffold:
    name: iOS scaffold validation
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Sync Capacitor iOS project
        working-directory: mobile
        run: npx cap sync ios

      - name: Check committed iOS scaffold
        run: |
          test -f mobile/ios/App/App.xcodeproj/project.pbxproj
          test -f mobile/ios/App/App/PrivacyInfo.xcprivacy
          test -f mobile/ios/App/App/Info.plist
          test -f mobile/ios/App/CapApp-SPM/Package.swift
          grep -q '<false/>' mobile/ios/App/App/Info.plist

  ios-archive:
    name: iOS unsigned archive
    runs-on: macos-14
    needs: ios-scaffold
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm --prefix mobile ci

      - name: Sync Capacitor iOS project
        working-directory: mobile
        run: npx cap sync ios

      - name: Resolve Swift packages
        run: xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -resolvePackageDependencies

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project mobile/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/BudgetPlanner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload iOS archive artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gulden-ios-unsigned-archive
          if-no-files-found: error
          path: ${{ runner.temp }}/BudgetPlanner.xcarchive
          retention-days: 14
